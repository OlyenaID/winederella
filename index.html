<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Winederella</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg:        #F5F4F9;
      --surface:   #EDEAF4;
      --wini-bg:   #EAE8F2;
      --border:    #E0DDE8;
      --lavender:  #C5C0D4;
      --lilac:     #9B93B8;
      --slate:     #7B6FA0;
      --midnight:  #2A2440;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.6;
      color: var(--midnight);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      max-width: 480px;
      margin: 0 auto;
      height: 100dvh;
      overflow: hidden;
    }

    /* ── Header ───────────────────────────────────────── */
    .header {
      flex-shrink: 0;
      padding: 14px 16px 12px 20px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 0.04em;
      color: var(--midnight);
    }

    .tagline {
      font-size: 12px;
      font-weight: 300;
      color: var(--lilac);
      margin-top: 2px;
    }

    .btn-menu {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      color: var(--midnight);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      flex-shrink: 0;
      padding: 6px;
      border-radius: 8px;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-menu:hover { background: var(--wini-bg); }

    /* V2: remove display:none to activate the drawer menu */
    .btn-menu { display: none; }

    .btn-menu span {
      display: block;
      width: 20px;
      height: 1.5px;
      background: var(--midnight);
      border-radius: 2px;
      transition: opacity 0.15s;
    }

    /* ── Drawer overlay ───────────────────────────────── */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(42, 36, 64, 0.35);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .drawer-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    /* ── Drawer ───────────────────────────────────────── */
    .drawer {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 280px;
      background: var(--bg);
      z-index: 101;
      display: flex;
      flex-direction: column;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      box-shadow: 4px 0 24px rgba(42, 36, 64, 0.12);
    }

    .drawer.open { transform: translateX(0); }

    .drawer-top {
      padding: 16px 16px 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .drawer-brand .logo { font-size: 20px; }
    .drawer-brand .tagline { font-size: 11px; }

    .btn-drawer-close {
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      color: var(--lilac);
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-drawer-close:hover { background: var(--wini-bg); color: var(--midnight); }

    .drawer-nav {
      flex: 1;
      padding: 12px 0;
      overflow-y: auto;
    }

    .drawer-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 20px;
      font-size: 14px;
      font-weight: 400;
      color: var(--lilac);
      cursor: default;
      user-select: none;
      border-radius: 0;
      transition: background 0.1s;
    }

    .drawer-item.active {
      color: var(--midnight);
      font-weight: 500;
      cursor: pointer;
    }

    .drawer-item.active:hover { background: var(--wini-bg); }

    .drawer-item svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .drawer-item-label { flex: 1; }

    .drawer-badge {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.05em;
      color: var(--lavender);
      background: var(--border);
      padding: 2px 6px;
      border-radius: 10px;
    }

    .drawer-divider {
      height: 1px;
      background: var(--border);
      margin: 8px 20px;
    }

    /* ── Chat area ────────────────────────────────────── */
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      -webkit-overflow-scrolling: touch;
    }

    .chat::-webkit-scrollbar { width: 0; }

    /* ── Message rows ─────────────────────────────────── */
    .row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .row.user {
      flex-direction: row-reverse;
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--midnight);
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      user-select: none;
    }

    .bubble {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.6;
      word-break: break-word;
    }

    .bubble.wini {
      background: var(--wini-bg);
      color: var(--midnight);
      border-bottom-left-radius: 4px;
    }

    .bubble.user {
      background: var(--slate);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .bubble img {
      display: block;
      max-width: 100%;
      border-radius: 10px;
      margin-bottom: 6px;
    }

    /* light markdown */
    .bubble p { margin-bottom: 7px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble strong { font-weight: 500; }
    .bubble em { font-style: italic; }
    .bubble ul, .bubble ol {
      padding-left: 18px;
      margin-bottom: 7px;
    }
    .bubble li { margin-bottom: 2px; }
    .bubble.user ul, .bubble.user ol { color: rgba(255,255,255,0.92); }

    /* typing indicator */
    .typing {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 12px 14px;
    }

    .typing span {
      display: block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--lavender);
      animation: dot-bounce 1.3s ease-in-out infinite;
    }

    .typing span:nth-child(2) { animation-delay: 0.18s; }
    .typing span:nth-child(3) { animation-delay: 0.36s; }

    @keyframes dot-bounce {
      0%, 60%, 100% { transform: translateY(0);   opacity: 0.6; }
      30%            { transform: translateY(-7px); opacity: 1;   }
    }

    /* ── Input bar ────────────────────────────────────── */
    .input-area {
      flex-shrink: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 10px 12px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    }

    .img-preview {
      display: none;
      margin-bottom: 8px;
      position: relative;
      width: fit-content;
    }

    .img-preview img {
      height: 64px;
      width: auto;
      border-radius: 8px;
      border: 1px solid var(--border);
      display: block;
    }

    .img-preview-remove {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--midnight);
      color: #fff;
      border: none;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .btn-attach {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1.5px solid var(--lavender);
      background: transparent;
      color: var(--lilac);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: border-color 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-attach:hover { border-color: var(--slate); color: var(--slate); }
    .btn-attach:disabled { opacity: 0.4; cursor: default; }

    .input-pill {
      flex: 1;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 8px 12px;
      display: flex;
      align-items: flex-end;
      min-height: 38px;
    }

    textarea {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px; /* must be ≥16px — iOS Safari zooms in on anything smaller */
      color: var(--midnight);
      resize: none;
      line-height: 1.5;
      max-height: 120px;
      overflow-y: auto;
    }

    textarea::placeholder { color: var(--lilac); }

    .btn-send {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--slate);
      border: none;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-send:disabled { opacity: 0.4; cursor: default; }

    /* V2: activate drawer items — Conversations, Tasting Notes, Cellar, Profile */

    /* ── Auth: header actions ─────────────────────────── */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-login {
      height: 32px;
      padding: 0 14px;
      border-radius: 16px;
      border: 1.5px solid var(--slate);
      background: transparent;
      color: var(--slate);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, color 0.15s;
    }
    .btn-login:hover { background: var(--slate); color: #fff; }

    /* ── Auth: user avatar + dropdown ─────────────────── */
    .user-menu { position: relative; display: none; }

    .user-avatar-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--slate);
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      flex-shrink: 0;
    }

    .user-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(42,36,64,0.13);
      min-width: 200px;
      overflow: hidden;
      z-index: 50;
      display: none;
    }
    .user-dropdown.open { display: block; }

    .dropdown-user-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
    }
    .dropdown-user-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--wini-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .dropdown-user-icon svg {
      width: 14px;
      height: 14px;
      stroke: var(--slate);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .dropdown-email {
      font-size: 12px;
      color: var(--lilac);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 12px 16px;
      font-size: 13px;
      color: var(--midnight);
      cursor: pointer;
      transition: background 0.1s;
    }
    .dropdown-item:hover { background: var(--wini-bg); }
    .dropdown-item svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }
    .dropdown-item.danger { color: #b03030; }

    /* ── Auth: modal ──────────────────────────────────── */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(42, 36, 64, 0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-backdrop.open { opacity: 1; pointer-events: all; }

    .modal {
      background: #fff;
      border-radius: 18px;
      padding: 32px 28px 28px;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      transform: translateY(10px);
      transition: transform 0.2s ease;
    }
    .modal-backdrop.open .modal { transform: translateY(0); }

    .modal-logo {
      font-size: 20px;
      font-weight: 300;
      letter-spacing: 0.04em;
      color: var(--midnight);
      text-align: center;
      margin-bottom: 3px;
    }
    .modal-subtitle {
      font-size: 12px;
      font-weight: 300;
      color: var(--lilac);
      text-align: center;
      margin-bottom: 24px;
    }

    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 11px 16px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: white;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: var(--midnight);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      margin-bottom: 16px;
    }
    .btn-google:hover { border-color: var(--lavender); background: var(--bg); }
    .btn-google:disabled { opacity: 0.5; cursor: default; }

    .modal-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--lavender);
      font-size: 12px;
      margin-bottom: 14px;
    }
    .modal-divider::before, .modal-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .modal-input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      color: var(--midnight);
      background: white;
      outline: none;
      margin-bottom: 10px;
      transition: border-color 0.15s;
      -webkit-appearance: none;
    }
    .modal-input:focus { border-color: var(--slate); }
    .modal-input::placeholder { color: var(--lilac); }

    .btn-auth-submit {
      width: 100%;
      padding: 11px 16px;
      border: none;
      border-radius: 10px;
      background: var(--slate);
      color: white;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 2px;
      transition: opacity 0.15s;
    }
    .btn-auth-submit:hover { opacity: 0.88; }
    .btn-auth-submit:disabled { opacity: 0.45; cursor: default; }

    .modal-error {
      font-size: 12px;
      color: #b03030;
      text-align: center;
      margin-top: 10px;
      min-height: 16px;
    }

    .modal-toggle {
      text-align: center;
      font-size: 13px;
      color: var(--lilac);
      margin-top: 14px;
    }
    .modal-toggle a {
      color: var(--slate);
      cursor: pointer;
      font-weight: 500;
      text-decoration: none;
    }

    /* ── Auth: save nudge strip ───────────────────────── */
    .nudge-strip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0 2px 38px;
    }

    .nudge-btn {
      height: 28px;
      padding: 0 12px;
      border-radius: 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s;
    }
    .nudge-btn:hover { opacity: 0.8; }
    .nudge-btn.primary { background: var(--slate); color: white; border: none; }
    .nudge-btn.secondary { background: transparent; color: var(--lilac); border: 1px solid var(--border); }
  </style>
</head>
<body>

  <!-- Drawer overlay -->
  <div class="drawer-overlay" id="drawerOverlay"></div>

  <!-- Left drawer -->
  <nav class="drawer" id="drawer" aria-label="Main menu">
    <div class="drawer-top">
      <div class="drawer-brand">
        <div class="logo">Winederella</div>
        <div class="tagline">your wine guide</div>
      </div>
      <button class="btn-drawer-close" id="drawerClose" aria-label="Close menu">×</button>
    </div>
    <div class="drawer-nav">
      <div class="drawer-item active">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span class="drawer-item-label">Chat</span>
      </div>
      <div class="drawer-divider"></div>
      <div class="drawer-item">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="13" y2="13"/></svg>
        <span class="drawer-item-label">Conversations</span>
        <span class="drawer-badge">soon</span>
      </div>
      <div class="drawer-item">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        <span class="drawer-item-label">Tasting Notes</span>
        <span class="drawer-badge">soon</span>
      </div>
      <div class="drawer-item">
        <svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
        <span class="drawer-item-label">Cellar</span>
        <span class="drawer-badge">soon</span>
      </div>
      <div class="drawer-item">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span class="drawer-item-label">Profile</span>
        <span class="drawer-badge">soon</span>
      </div>
    </div>
  </nav>

  <!-- Header -->
  <header class="header">
    <div>
      <div class="logo">Winederella</div>
      <div class="tagline">your wine guide</div>
    </div>
    <div class="header-actions">
      <!-- Login button — hidden when signed in -->
      <button class="btn-login" id="loginBtn">Sign in</button>
      <!-- Avatar + dropdown — hidden when signed out -->
      <div class="user-menu" id="userMenu">
        <button class="user-avatar-btn" id="userAvatarBtn" aria-label="Account menu">?</button>
        <div class="user-dropdown" id="userDropdown">
          <div class="dropdown-user-row">
            <div class="dropdown-user-icon">
              <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
            <div class="dropdown-email" id="dropdownEmail">—</div>
          </div>
          <div class="dropdown-item danger" id="signOutItem">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Log out
          </div>
        </div>
      </div>
      <!-- V2: remove display:none to activate the drawer menu -->
      <button class="btn-menu" id="menuBtn" aria-label="Open menu" style="display:none">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- Auth modal -->
  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-label="Sign in">
    <div class="modal">
      <div class="modal-logo">Winederella</div>
      <div class="modal-subtitle">your wine guide</div>

      <button class="btn-google" id="googleSignInBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>

      <div class="modal-divider">or</div>

      <input class="modal-input" type="email"    id="authEmail"    placeholder="Email address" autocomplete="email">
      <input class="modal-input" type="password" id="authPassword" placeholder="Password"      autocomplete="current-password">
      <button class="btn-auth-submit" id="authSubmitBtn">Sign in</button>
      <div class="modal-error" id="authError"></div>

      <div class="modal-toggle">
        <span id="authToggleText">Don't have an account?</span>&nbsp;<a id="authToggleLink">Sign up</a>
      </div>
    </div>
  </div>

  <!-- Chat -->
  <main class="chat" id="chat"></main>

  <!-- Input -->
  <div class="input-area">
    <div class="img-preview" id="imgPreview">
      <img id="previewSrc" src="" alt="">
      <button class="img-preview-remove" id="removeImg" aria-label="Remove image">×</button>
    </div>
    <div class="input-row">
      <button class="btn-attach" id="attachBtn" aria-label="Attach photo">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
      </button>
      <input type="file" id="fileInput" accept="image/*" style="display:none">
      <div class="input-pill">
        <textarea id="msgInput" placeholder="Ask Wini anything…" rows="1" aria-label="Message"></textarea>
      </div>
      <button class="btn-send" id="sendBtn" disabled aria-label="Send">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="white" stroke="none">
          <path d="M2 21L23 12 2 3v7l15 2-15 2v7z"/>
        </svg>
      </button>
    </div>
  </div>


  <script>
    // ── Session state ──────────────────────────────────────────────────────────
    // V2: persist session to database for cross-session memory and user profiles
    const session = {
      messages: [],      // [{role, content}] — full history sent to API
      preferences: {}    // V2: populated from onboarding + profile
    };

    // ── DOM refs ───────────────────────────────────────────────────────────────
    const chat      = document.getElementById('chat');
    const msgInput  = document.getElementById('msgInput');
    const sendBtn   = document.getElementById('sendBtn');
    const attachBtn = document.getElementById('attachBtn');
    const fileInput = document.getElementById('fileInput');
    const imgPreview   = document.getElementById('imgPreview');
    const previewSrc   = document.getElementById('previewSrc');
    const removeImgBtn = document.getElementById('removeImg');
    const menuBtn      = document.getElementById('menuBtn');
    const drawer       = document.getElementById('drawer');
    const drawerOverlay = document.getElementById('drawerOverlay');
    const drawerClose  = document.getElementById('drawerClose');

    let pendingImage = null; // { base64, mediaType, dataUrl }
    let isLoading    = false;

    // ── Auth state ─────────────────────────────────────────────────────────────
    let supabaseClient       = null;
    let currentUser          = null;
    let currentConvId        = null; // active conversation ID in Supabase
    let winiResponseCount    = 0;    // counts real responses (not the greeting)
    let nudgeShown           = false;
    let authMode             = 'signin'; // 'signin' | 'signup'

    // ── Auth: Supabase init ────────────────────────────────────────────────────

    async function initSupabase() {
      try {
        const cfg = await fetch('/api/config').then(r => r.json());
        if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) return;
        supabaseClient = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

        // onAuthStateChange fires immediately with the current state
        // (INITIAL_SESSION) covering page reloads, OAuth redirects and
        // existing localStorage sessions — no separate getSession() needed.
        supabaseClient.auth.onAuthStateChange(async (event, authSession) => {
          if (authSession?.user) {
            const isNewSignIn = !currentUser;
            currentUser = authSession.user;
            updateHeaderForUser(currentUser);
            hideModal();
            // Only save conversation on an explicit new sign-in, not every reload
            if (isNewSignIn && event === 'SIGNED_IN' && !currentConvId) {
              await saveCurrentConversation();
            }
          } else if (event === 'SIGNED_OUT' || (event === 'INITIAL_SESSION' && !authSession)) {
            currentUser   = null;
            currentConvId = null;
            updateHeaderForUser(null);
          }
        });

      } catch (err) {
        console.warn('Supabase init failed — auth unavailable:', err.message);
        // App continues to work fully without auth
      }
    }

    // ── Auth: header UI ────────────────────────────────────────────────────────

    function updateHeaderForUser(user) {
      const loginBtn     = document.getElementById('loginBtn');
      const userMenu     = document.getElementById('userMenu');
      const avatarBtn    = document.getElementById('userAvatarBtn');
      const dropdownEmail = document.getElementById('dropdownEmail');

      if (user) {
        loginBtn.style.display   = 'none';
        userMenu.style.display   = 'flex';
        const name               = user.user_metadata?.full_name || user.email || '';
        avatarBtn.textContent    = name[0]?.toUpperCase() || '?';
        if (dropdownEmail) dropdownEmail.textContent = user.email || '';
      } else {
        loginBtn.style.display  = '';
        userMenu.style.display  = 'none';
      }
    }

    // Avatar dropdown toggle
    document.getElementById('userAvatarBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      document.getElementById('userDropdown').classList.toggle('open');
    });

    document.addEventListener('click', () => {
      document.getElementById('userDropdown').classList.remove('open');
    });

    document.getElementById('signOutItem').addEventListener('click', async () => {
      if (supabaseClient) await supabaseClient.auth.signOut();
    });

    // ── Auth: modal ────────────────────────────────────────────────────────────

    function showModal() {
      document.getElementById('modalBackdrop').classList.add('open');
      document.getElementById('authEmail').focus();
      setAuthMode('signin');
    }

    function hideModal() {
      document.getElementById('modalBackdrop').classList.remove('open');
      document.getElementById('authError').textContent = '';
      document.getElementById('authEmail').value    = '';
      document.getElementById('authPassword').value = '';
    }

    function setAuthMode(mode) {
      authMode = mode;
      const submitBtn  = document.getElementById('authSubmitBtn');
      const toggleText = document.getElementById('authToggleText');
      const toggleLink = document.getElementById('authToggleLink');
      const pwdInput   = document.getElementById('authPassword');

      if (mode === 'signin') {
        submitBtn.textContent  = 'Sign in';
        toggleText.textContent = "Don't have an account?";
        toggleLink.textContent = 'Sign up';
        pwdInput.autocomplete  = 'current-password';
      } else {
        submitBtn.textContent  = 'Create account';
        toggleText.textContent = 'Already have an account?';
        toggleLink.textContent = 'Sign in';
        pwdInput.autocomplete  = 'new-password';
      }
      document.getElementById('authError').textContent = '';
    }

    document.getElementById('loginBtn').addEventListener('click', showModal);

    // Close on backdrop click
    document.getElementById('modalBackdrop').addEventListener('click', (e) => {
      if (e.target === document.getElementById('modalBackdrop')) hideModal();
    });

    document.getElementById('authToggleLink').addEventListener('click', () => {
      setAuthMode(authMode === 'signin' ? 'signup' : 'signin');
    });

    // ── Auth: Google OAuth ─────────────────────────────────────────────────────

    document.getElementById('googleSignInBtn').addEventListener('click', async () => {
      if (!supabaseClient) return;
      const btn = document.getElementById('googleSignInBtn');
      btn.disabled = true;
      btn.textContent = 'Redirecting…';
      await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin },
      });
      // Page will redirect — no need to re-enable button
    });

    // ── Auth: email + password ─────────────────────────────────────────────────

    document.getElementById('authSubmitBtn').addEventListener('click', handleEmailAuth);

    document.getElementById('authPassword').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleEmailAuth();
    });

    async function handleEmailAuth() {
      if (!supabaseClient) return;
      const email    = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;
      const errEl    = document.getElementById('authError');
      const submitBtn = document.getElementById('authSubmitBtn');

      if (!email || !password) { errEl.textContent = 'Please fill in both fields.'; return; }

      submitBtn.disabled = true;
      submitBtn.textContent = authMode === 'signin' ? 'Signing in…' : 'Creating account…';
      errEl.textContent = '';

      try {
        let result;
        if (authMode === 'signin') {
          result = await supabaseClient.auth.signInWithPassword({ email, password });
        } else {
          result = await supabaseClient.auth.signUp({ email, password });
          if (!result.error && result.data.user && !result.data.session) {
            errEl.style.color = 'var(--slate)';
            errEl.textContent = 'Check your email to confirm your account.';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Create account';
            return;
          }
        }
        if (result.error) throw result.error;
        // onAuthStateChange handles the rest
      } catch (err) {
        errEl.style.color = '';
        errEl.textContent = err.message || 'Something went wrong. Try again.';
        submitBtn.disabled = false;
        submitBtn.textContent = authMode === 'signin' ? 'Sign in' : 'Create account';
      }
    }

    // ── Auth: save conversation to Supabase ────────────────────────────────────

    async function saveCurrentConversation() {
      if (!supabaseClient || !currentUser || currentConvId) return;

      // Filter out the synthetic seeding exchange
      const real = session.messages.filter(
        m => !(m.role === 'user' && m.content === 'Hi')
      );
      if (real.length < 2) return;

      try {
        const firstUser = real.find(m => m.role === 'user');
        const raw  = typeof firstUser?.content === 'string'
          ? firstUser.content
          : firstUser?.content?.find?.(c => c.type === 'text')?.text || 'Conversation';
        const title = raw.slice(0, 50);

        const { data: conv, error } = await supabaseClient
          .from('conversations')
          .insert({ user_id: currentUser.id, title })
          .select()
          .single();

        if (error) throw error;
        currentConvId = conv.id;

        const rows = real.map(m => ({
          conversation_id: currentConvId,
          role:    m.role,
          content: typeof m.content === 'string' ? m.content : JSON.stringify(m.content),
        }));
        await supabaseClient.from('messages').insert(rows);

      } catch (err) {
        console.error('Failed to save conversation:', err.message);
      }
    }

    async function appendToConversation(userContent, assistantText) {
      // Called after each exchange when the user is logged in
      if (!supabaseClient || !currentUser) return;

      try {
        // Create conversation on first real message
        if (!currentConvId) {
          const raw = typeof userContent === 'string'
            ? userContent
            : userContent?.find?.(c => c.type === 'text')?.text || 'Conversation';
          const title = raw.slice(0, 50);

          const { data: conv, error } = await supabaseClient
            .from('conversations')
            .insert({ user_id: currentUser.id, title })
            .select()
            .single();

          if (error) throw error;
          currentConvId = conv.id;
        }

        await supabaseClient.from('messages').insert([
          { conversation_id: currentConvId, role: 'user',
            content: typeof userContent === 'string' ? userContent : JSON.stringify(userContent) },
          { conversation_id: currentConvId, role: 'assistant', content: assistantText },
        ]);
      } catch (err) {
        console.error('Failed to append messages:', err.message);
      }
    }

    // ── Auth: save nudge strip ─────────────────────────────────────────────────

    function appendNudgeStrip() {
      const strip = document.createElement('div');
      strip.className = 'nudge-strip';

      const saveBtn = document.createElement('button');
      saveBtn.className    = 'nudge-btn primary';
      saveBtn.textContent  = 'Save my taste profile';
      saveBtn.addEventListener('click', () => { strip.remove(); showModal(); });

      const laterBtn = document.createElement('button');
      laterBtn.className   = 'nudge-btn secondary';
      laterBtn.textContent = 'Maybe later';
      laterBtn.addEventListener('click', () => strip.remove());

      strip.appendChild(saveBtn);
      strip.appendChild(laterBtn);
      chat.appendChild(strip);
      scrollBottom();
    }

    // ── Drawer ─────────────────────────────────────────────────────────────────

    function openDrawer() {
      drawer.classList.add('open');
      drawerOverlay.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeDrawer() {
      drawer.classList.remove('open');
      drawerOverlay.classList.remove('open');
      document.body.style.overflow = '';
    }

    menuBtn.addEventListener('click', openDrawer);
    drawerClose.addEventListener('click', closeDrawer);
    drawerOverlay.addEventListener('click', closeDrawer);

    // Close drawer or modal on Escape
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { closeDrawer(); hideModal(); }
    });

    // ── Helpers ────────────────────────────────────────────────────────────────

    function scrollBottom() {
      chat.scrollTop = chat.scrollHeight;
    }

    // Minimal markdown → HTML (no external deps)
    function renderMarkdown(text) {
      const escaped = text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      const lines = escaped.split('\n');
      let html = '';
      let inList = false;
      let listTag = '';

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i];

        // Bold & italic
        line = line
          .replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>')
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/\*(.+?)\*/g, '<em>$1</em>');

        // Unordered list item
        const ulMatch = line.match(/^[-•]\s+(.*)/);
        // Ordered list item
        const olMatch = line.match(/^\d+\.\s+(.*)/);

        if (ulMatch) {
          if (!inList || listTag !== 'ul') {
            if (inList) html += `</${listTag}>`;
            html += '<ul>';
            inList = true; listTag = 'ul';
          }
          html += `<li>${ulMatch[1]}</li>`;
        } else if (olMatch) {
          if (!inList || listTag !== 'ol') {
            if (inList) html += `</${listTag}>`;
            html += '<ol>';
            inList = true; listTag = 'ol';
          }
          html += `<li>${olMatch[1]}</li>`;
        } else {
          if (inList) { html += `</${listTag}>`; inList = false; }
          if (line.trim() === '') {
            // blank line = paragraph break (swallow multiple blanks)
          } else {
            html += `<p>${line}</p>`;
          }
        }
      }

      if (inList) html += `</${listTag}>`;
      return html;
    }

    function setDisabled(disabled) {
      msgInput.disabled   = disabled;
      attachBtn.disabled  = disabled;
      sendBtn.disabled    = disabled || (!msgInput.value.trim() && !pendingImage);
    }

    function updateSendBtn() {
      sendBtn.disabled = isLoading || (!msgInput.value.trim() && !pendingImage);
    }

    // ── Render messages ────────────────────────────────────────────────────────

    function appendMessage(role, text, imageDataUrl) {
      const row = document.createElement('div');
      row.className = `row ${role}`;

      if (role === 'wini') {
        const av = document.createElement('div');
        av.className = 'avatar';
        av.textContent = 'W';
        av.setAttribute('aria-hidden', 'true');
        row.appendChild(av);
      }

      const bubble = document.createElement('div');
      bubble.className = `bubble ${role}`;

      if (imageDataUrl) {
        const img = document.createElement('img');
        img.src = imageDataUrl;
        img.alt = 'Attached photo';
        bubble.appendChild(img);
      }

      if (text) {
        const inner = document.createElement('div');
        inner.innerHTML = renderMarkdown(text);
        bubble.appendChild(inner);
      }

      row.appendChild(bubble);
      chat.appendChild(row);
      scrollBottom();
      return { row, bubble };
    }

    function addTyping() {
      const row = document.createElement('div');
      row.className = 'row wini';
      row.id = 'typing-row';

      const av = document.createElement('div');
      av.className = 'avatar';
      av.textContent = 'W';
      av.setAttribute('aria-hidden', 'true');
      row.appendChild(av);

      const bubble = document.createElement('div');
      bubble.className = 'bubble wini';
      bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
      row.appendChild(bubble);

      chat.appendChild(row);
      scrollBottom();
    }

    function removeTyping() {
      const el = document.getElementById('typing-row');
      if (el) el.remove();
    }

    // ── Image attach ───────────────────────────────────────────────────────────

    attachBtn.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          // Resize to max 1024px on longest side before encoding —
          // prevents hitting Vercel's 4.5 MB body limit on real phone photos
          const MAX = 1024;
          let { width, height } = img;
          if (width > MAX || height > MAX) {
            if (width > height) { height = Math.round(height * MAX / width); width = MAX; }
            else                { width  = Math.round(width  * MAX / height); height = MAX; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          const mediaType = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
          const dataUrl   = canvas.toDataURL(mediaType, 0.85);
          const base64    = dataUrl.split(',')[1];
          pendingImage = { base64, mediaType, dataUrl };
          previewSrc.src = dataUrl;
          imgPreview.style.display = 'block';
          updateSendBtn();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
      fileInput.value = '';
    });

    removeImgBtn.addEventListener('click', () => {
      pendingImage = null;
      imgPreview.style.display = 'none';
      previewSrc.src = '';
      updateSendBtn();
    });

    // ── Textarea auto-resize ───────────────────────────────────────────────────

    msgInput.addEventListener('input', () => {
      msgInput.style.height = 'auto';
      msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
      updateSendBtn();
    });

    msgInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!sendBtn.disabled) sendMessage();
      }
    });

    sendBtn.addEventListener('click', sendMessage);

    // ── Send ───────────────────────────────────────────────────────────────────

    async function sendMessage() {
      if (isLoading) return;
      const text = msgInput.value.trim();
      if (!text && !pendingImage) return;

      // Build API content block
      const contentBlocks = [];
      let displayImageUrl = null;

      if (pendingImage) {
        contentBlocks.push({
          type: 'image',
          source: {
            type: 'base64',
            media_type: pendingImage.mediaType,
            data: pendingImage.base64,
          },
        });
        displayImageUrl = pendingImage.dataUrl;
      }

      if (text) {
        contentBlocks.push({ type: 'text', text });
      }

      // Render user message
      appendMessage('user', text, displayImageUrl);

      // Add to session history
      session.messages.push({
        role: 'user',
        content: contentBlocks.length === 1 && contentBlocks[0].type === 'text'
          ? text          // shorthand for text-only
          : contentBlocks,
      });

      // Reset input
      msgInput.value = '';
      msgInput.style.height = 'auto';
      pendingImage = null;
      imgPreview.style.display = 'none';
      previewSrc.src = '';

      isLoading = true;
      setDisabled(true);
      addTyping();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: session.messages }),
        });

        removeTyping();

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error || `Server error ${res.status}`);
        }

        // V2: parse structured wine data for notes storage
        const data = await res.json();
        const replyText = data?.content?.[0]?.text ?? '';

        appendMessage('wini', replyText);
        session.messages.push({ role: 'assistant', content: replyText });

        // Save to Supabase if logged in
        await appendToConversation(
          contentBlocks.length === 1 && contentBlocks[0].type === 'text'
            ? text : contentBlocks,
          replyText
        );

        // Save nudge — show after 3rd real response if not logged in
        winiResponseCount++;
        if (winiResponseCount === 3 && !currentUser && !nudgeShown) {
          nudgeShown = true;
          appendNudgeStrip();
        }

      } catch (err) {
        removeTyping();
        appendMessage('wini', `Something went wrong — ${err.message}. Try again?`);
      } finally {
        isLoading = false;
        setDisabled(false);
        updateSendBtn();
        msgInput.focus();
      }
    }

    // ── Boot: let the model generate its own opening greeting ─────────────────
    // V2: onboarding flow here on first launch — collect preferences, budget, preferred shop
    //
    // We call the API with [user:'Hi'] so the model generates the greeting itself
    // and is already in Wini's voice before the user types anything — same as
    // how Claude.ai works. A hardcoded greeting fed back as history doesn't warm
    // the model into character; generating it does.

    async function init() {
      setDisabled(true);
      addTyping();

      session.messages.push({ role: 'user', content: 'Hi' });

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: session.messages }),
        });

        removeTyping();

        if (!res.ok) throw new Error('Failed to connect');

        const data = await res.json();
        const greeting = data?.content?.[0]?.text ?? "Hi, I'm Winederella — Wini for short — your wine guide. Tell me what's going on right now and I'll help.";

        appendMessage('wini', greeting);
        session.messages.push({ role: 'assistant', content: greeting });

      } catch {
        removeTyping();
        const fallback = "Hi, I'm Winederella — Wini for short — your wine guide. Tell me what's going on right now and I'll help. Are you shopping, cooking, at a restaurant, or planning something?";
        appendMessage('wini', fallback);
        session.messages.push({ role: 'assistant', content: fallback });
      } finally {
        setDisabled(false);
        updateSendBtn();
        msgInput.focus();
      }
    }

    // ── Boot sequence ──────────────────────────────────────────────────────────
    async function boot() {
      await initSupabase(); // sets up auth before chat loads
      await init();         // generates Wini's greeting
    }

    boot();
  </script>

</body>
