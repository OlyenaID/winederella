<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Winederella</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ── Brand tokens ─────────────────────────────────── */
    :root {
      --parchment:    #FAF6F0;
      --white:        #FFFFFF;
      --warm-linen:   #EFE5D8;
      --midnight:     #2A0A1E;
      --deep-plum:    #3D1230;
      --dark-rose:    #5A1A45;
      --wine-rose:    #6B4455;
      --dusty-clay:   #C4A898;
      --blush-mauve:  #C8A0B0;
      --magenta:      #C71585;
      --hot-pink:     #FF69B4;
      --petal-pink:   #FFE0EE;
      --soft-pink:    #F4B8D4;
      --cream:        #F2DEC8;
      --linen-border: #E5DDD4;
      --linen-dark:   #D4C4B8;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 300;
      line-height: 1.6;
      color: var(--midnight);
      background: var(--parchment);
      display: flex;
      flex-direction: column;
      max-width: 480px;
      margin: 0 auto;
      height: 100dvh;
      overflow: hidden;
    }

    /* ── Header ───────────────────────────────────────── */
    .header {
      flex-shrink: 0;
      padding: 12px 24px;
      background: var(--midnight);
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }
    @media (max-width: 768px) {
      .header { padding: 12px 16px; height: 56px; }
    }

    /* ── Logo ─────────────────────────────────────────── */
    .header-logo {
      display: flex; flex-direction: row; align-items: center;
      gap: 10px; text-decoration: none;
    }
    .header-logo-icon { height: 44px; width: auto; display: block; flex-shrink: 0; }
    .header-logo-text {
      display: flex; flex-direction: column;
      align-items: flex-start; justify-content: center; gap: 2px;
    }
    .header-logo-name {
      font-family: Georgia, serif; font-style: italic; font-weight: 700;
      font-size: 22px; color: #C71585; line-height: 1; display: block;
    }
    .header-logo-sub {
      font-family: 'DM Sans', sans-serif; font-weight: 400;
      font-size: 8px; letter-spacing: 0.2em; text-transform: uppercase;
      color: #F4B8D4; line-height: 1; display: block; white-space: nowrap;
    }
    @media (max-width: 768px) {
      .header-logo-icon { height: 34px; }
      .header-logo-name { font-size: 18px; }
      .header-logo-sub  { font-size: 7px; letter-spacing: 0.16em; }
    }

    /* ── Header left grouping ─────────────────────────── */
    .header-left { display: flex; flex-direction: row; align-items: center; gap: 14px; }

    /* ── Hamburger ────────────────────────────────────── */
    .btn-hamburger {
      width: 36px; height: 36px;
      border: none; background: transparent;
      color: var(--soft-pink);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0; padding: 0;
      border-radius: 8px;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-hamburger:hover { background: rgba(199,21,133,0.15); }

    /* ── Drawer overlay ───────────────────────────────── */
    .drawer-overlay {
      position: fixed; inset: 0;
      background: rgba(42,10,30,0.5);
      z-index: 100; opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .drawer-overlay.open { opacity: 1; pointer-events: all; }

    /* ── Drawer ───────────────────────────────────────── */
    .drawer {
      position: fixed; top: 0; left: 0; bottom: 0;
      width: 280px;
      background: var(--midnight);
      border-right: 0.5px solid var(--dark-rose);
      z-index: 101;
      display: flex; flex-direction: column;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
    }
    @media (max-width: 400px) { .drawer { width: 85vw; } }
    .drawer.open { transform: translateX(0); }

    .drawer-header {
      display: flex; align-items: center; justify-content: flex-end;
      padding: 14px 12px 14px 20px;
      border-bottom: 0.5px solid var(--dark-rose);
      flex-shrink: 0;
    }
    .btn-drawer-close {
      width: 32px; height: 32px;
      border: none; background: transparent;
      color: var(--dark-rose); font-size: 22px; line-height: 1;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      border-radius: 6px; -webkit-tap-highlight-color: transparent;
    }
    .btn-drawer-close:hover { color: var(--soft-pink); }

    .drawer-new-chat-wrap { padding: 12px 14px; flex-shrink: 0; }
    .btn-new-chat {
      width: 100%; padding: 9px 16px;
      background: rgba(199,21,133,0.2);
      border: 0.5px solid rgba(199,21,133,0.3);
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 11px; font-weight: 400;
      color: var(--soft-pink);
      cursor: pointer; transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-new-chat:hover { background: rgba(199,21,133,0.3); }

    .drawer-divider { height: 0.5px; background: var(--dark-rose); flex-shrink: 0; }

    .drawer-section-label {
      padding: 10px 20px 6px;
      font-size: 9px; font-weight: 500;
      color: var(--blush-mauve);
      text-transform: uppercase; letter-spacing: 0.12em;
      flex-shrink: 0;
    }

    .drawer-conv-list { flex: 1; overflow-y: auto; padding: 4px 0; }
    .drawer-conv-list::-webkit-scrollbar { width: 3px; }
    .drawer-conv-list::-webkit-scrollbar-track { background: transparent; }
    .drawer-conv-list::-webkit-scrollbar-thumb { background: var(--dark-rose); border-radius: 2px; }

    .drawer-conv-item {
      display: flex; flex-direction: column; gap: 2px;
      padding: 10px 20px; cursor: pointer;
      border-left: 2px solid transparent;
      transition: background 0.1s;
    }
    .drawer-conv-item:hover { background: rgba(199,21,133,0.1); }
    .drawer-conv-item:hover .drawer-conv-item-title { color: var(--soft-pink); }
    .drawer-conv-item.active { background: rgba(199,21,133,0.2); border-left-color: var(--magenta); }
    .drawer-conv-item-title {
      font-size: 11px; font-weight: 300;
      color: var(--blush-mauve);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .drawer-conv-item.active .drawer-conv-item-title { color: var(--soft-pink); }
    .drawer-conv-item-date { font-size: 10px; color: var(--dark-rose); }

    .drawer-conv-empty { padding: 16px 20px; font-size: 11px; font-weight: 300; color: var(--dark-rose); }

    .drawer-signin-prompt { padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; }
    .drawer-signin-prompt p { font-size: 11px; font-weight: 300; color: var(--blush-mauve); line-height: 1.5; }
    .btn-drawer-signin {
      height: 30px; padding: 0 14px;
      border-radius: 15px;
      border: 0.5px solid var(--magenta);
      background: transparent; color: var(--soft-pink);
      font-family: 'DM Sans', sans-serif;
      font-size: 11px; font-weight: 400;
      cursor: pointer; align-self: flex-start;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s;
    }
    .btn-drawer-signin:hover { background: rgba(199,21,133,0.2); }

    /* ── Drawer profile section ───────────────────────── */
    .drawer-profile { flex-shrink: 0; border-top: 0.5px solid var(--dark-rose); padding: 14px 20px; }
    .drawer-profile-user { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .drawer-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(199,21,133,0.3);
      color: var(--soft-pink);
      font-family: Georgia, serif; font-style: italic; font-weight: 700;
      font-size: 15px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; user-select: none;
    }
    .drawer-profile-name { font-size: 12px; font-weight: 300; color: var(--blush-mauve); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .drawer-profile-actions { display: flex; align-items: center; gap: 12px; }
    .drawer-profile-link { font-size: 11px; color: var(--blush-mauve); cursor: pointer; text-decoration: none; }
    .drawer-profile-link:hover { color: var(--soft-pink); }
    .btn-drawer-signout {
      font-size: 11px; color: var(--magenta);
      background: none;
      border: 0.5px solid rgba(199,21,133,0.3);
      border-radius: 12px; padding: 3px 10px;
      cursor: pointer; font-family: 'DM Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s;
    }
    .btn-drawer-signout:hover { background: rgba(199,21,133,0.15); }

    /* ── Chat area ────────────────────────────────────── */
    .chat {
      flex: 1; overflow-y: auto;
      padding: 16px 14px 8px;
      display: flex; flex-direction: column; gap: 10px;
      background: var(--parchment);
      -webkit-overflow-scrolling: touch;
    }
    .chat::-webkit-scrollbar { width: 4px; }
    .chat::-webkit-scrollbar-track { background: var(--parchment); }
    .chat::-webkit-scrollbar-thumb { background: var(--linen-border); border-radius: 2px; }
    .chat::-webkit-scrollbar-thumb:hover { background: var(--linen-dark); }

    /* ── Message rows ─────────────────────────────────── */
    .row { display: flex; align-items: flex-end; gap: 8px; }
    .row.user { flex-direction: row-reverse; }

    .avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--deep-plum);
      color: var(--soft-pink);
      font-family: Georgia, serif; font-style: italic; font-weight: 700;
      font-size: 12px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; user-select: none;
    }

    .bubble {
      max-width: 78%; padding: 10px 14px;
      font-size: 13px; font-weight: 300;
      line-height: 1.65; word-break: break-word;
    }
    .bubble.wini {
      background: var(--white); color: var(--midnight);
      border: 0.5px solid var(--linen-border);
      border-radius: 12px 12px 12px 2px;
    }
    .bubble.user {
      background: var(--warm-linen); color: var(--midnight);
      border: 0.5px solid var(--linen-dark);
      border-radius: 12px 12px 2px 12px;
    }
    .bubble img { display: block; border-radius: 8px; }
    .bubble-img-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
    .bubble-img-wrap.single img { max-width: 100%; }
    .bubble-img-wrap.multi img { max-width: 160px; max-height: 160px; width: auto; height: auto; }

    /* markdown */
    .bubble p { margin-bottom: 6px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble strong { font-weight: 500; }
    .bubble em { font-style: italic; }
    .bubble ul, .bubble ol { padding-left: 16px; margin-bottom: 6px; }
    .bubble li { margin-bottom: 2px; }

    /* inline wine links in Wini bubbles */
    .bubble.wini a {
      color: var(--midnight); font-style: italic; font-weight: 500;
      text-decoration: underline;
      text-decoration-color: var(--magenta);
      text-underline-offset: 3px;
    }
    .bubble.wini a:hover { color: var(--magenta); }
    .bubble hr { border: none; border-top: 1px solid var(--border); margin: 8px 0; }

    /* typing indicator */
    .typing { display: flex; align-items: center; gap: 5px; padding: 12px 14px; }
    .typing span {
      display: block; width: 6px; height: 6px; border-radius: 50%;
      background: var(--dusty-clay);
      animation: dot-bounce 1.3s ease-in-out infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.18s; }
    .typing span:nth-child(3) { animation-delay: 0.36s; }
    @keyframes dot-bounce {
      0%, 60%, 100% { transform: translateY(0);   opacity: 0.6; }
      30%            { transform: translateY(-6px); opacity: 1;   }
    }

    /* ── Input bar ────────────────────────────────────── */
    .input-area {
      flex-shrink: 0;
      background: var(--parchment);
      border-top: 0.5px solid var(--linen-border);
      padding: 10px 12px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    }
    .img-preview { display: none; margin-bottom: 8px; gap: 6px; flex-wrap: wrap; }
    .img-preview.show { display: flex; }
    .img-thumb { position: relative; width: fit-content; }
    .img-thumb img { height: 64px; width: auto; border-radius: 8px; border: 0.5px solid var(--linen-border); display: block; }
    .img-thumb-remove {
      position: absolute; top: -6px; right: -6px;
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--midnight); color: #fff; border: none;
      font-size: 12px; line-height: 1; cursor: pointer;
      display: flex; align-items: center; justify-content: center; padding: 0;
    }
    .attach-warning { display: none; font-size: 11px; font-weight: 400; color: var(--dark-rose); margin-bottom: 6px; }
    .attach-warning.show { display: block; }
    .input-row { display: flex; align-items: flex-end; gap: 8px; }
    .btn-attach {
      width: 34px; height: 34px; border-radius: 50%;
      border: none; background: transparent;
      color: var(--dusty-clay);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
      transition: color 0.15s; -webkit-tap-highlight-color: transparent;
    }
    .btn-attach:hover { color: var(--wine-rose); }
    .btn-attach:disabled { opacity: 0.4; cursor: default; }
    .input-pill {
      flex: 1; background: var(--white);
      border: 0.5px solid var(--linen-border);
      border-radius: 20px; padding: 8px 12px;
      display: flex; align-items: flex-end; min-height: 38px;
    }
    textarea {
      flex: 1; border: none; outline: none; background: transparent;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px; /* ≥16px prevents iOS zoom */
      font-weight: 300; color: var(--midnight);
      resize: none; line-height: 1.5; max-height: 120px; overflow-y: auto;
    }
    textarea::placeholder { color: var(--dusty-clay); font-weight: 300; }
    .btn-send {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--magenta); border: none; color: #fff;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
      transition: background 0.15s; -webkit-tap-highlight-color: transparent;
    }
    .btn-send:hover { background: var(--hot-pink); }
    .btn-send:disabled { opacity: 0.4; cursor: default; }

    /* ── Auth: header actions (legacy — hidden) ───────── */
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .btn-login {
      height: 30px; padding: 0 14px; border-radius: 15px;
      border: 0.5px solid var(--magenta); background: transparent;
      color: var(--soft-pink);
      font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 400;
      cursor: pointer; white-space: nowrap; -webkit-tap-highlight-color: transparent;
      transition: background 0.15s;
    }
    .btn-login:hover { background: rgba(199,21,133,0.2); }
    .user-menu { position: relative; display: none; }
    .user-avatar-btn {
      width: 32px; height: 32px; border-radius: 50%;
      background: rgba(199,21,133,0.3); color: var(--soft-pink);
      font-size: 13px; font-weight: 500;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; border: none; user-select: none;
      -webkit-tap-highlight-color: transparent; flex-shrink: 0;
    }
    .user-dropdown {
      position: absolute; top: calc(100% + 8px); right: 0;
      background: var(--white); border: 0.5px solid var(--linen-border);
      border-radius: 12px; box-shadow: 0 4px 20px rgba(42,10,30,0.12);
      min-width: 200px; overflow: hidden; z-index: 50; display: none;
    }
    .user-dropdown.open { display: block; }
    .dropdown-user-row { display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-bottom: 0.5px solid var(--linen-border); }
    .dropdown-user-icon { width: 28px; height: 28px; border-radius: 50%; background: var(--parchment); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .dropdown-user-icon svg { width: 14px; height: 14px; stroke: var(--wine-rose); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .dropdown-email { font-size: 12px; color: var(--wine-rose); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dropdown-item { display: flex; align-items: center; gap: 9px; padding: 12px 16px; font-size: 13px; color: var(--midnight); cursor: pointer; transition: background 0.1s; }
    .dropdown-item:hover { background: var(--parchment); }
    .dropdown-item svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    .dropdown-item.danger { color: var(--dark-rose); }

    /* ── Auth modal ───────────────────────────────────── */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(42,10,30,0.5);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      z-index: 300; display: flex; align-items: center; justify-content: center;
      padding: 20px; opacity: 0; pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-backdrop.open { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--white); border-radius: 16px;
      padding: 32px 28px 28px; width: 100%; max-width: 360px;
      display: flex; flex-direction: column;
      transform: translateY(10px); transition: transform 0.2s ease;
    }
    .modal-backdrop.open .modal { transform: translateY(0); }
    .modal-logo {
      font-family: Georgia, serif; font-style: italic; font-weight: 700;
      font-size: 22px; color: var(--magenta);
      text-align: center; margin-bottom: 4px;
      position: relative;
    }
    .modal-logo::before {
      content: ''; position: absolute;
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--cream);
      top: -3px; left: calc(50% - 22px);
    }
    .modal-subtitle {
      font-size: 9px; font-weight: 400;
      color: var(--wine-rose); text-transform: uppercase;
      letter-spacing: 0.2em; text-align: center; margin-bottom: 24px;
    }
    .btn-google {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 11px 16px;
      border: 0.5px solid var(--linen-border); border-radius: 10px;
      background: var(--white);
      font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 400;
      color: var(--midnight); cursor: pointer;
      transition: border-color 0.15s, background 0.15s; margin-bottom: 16px;
    }
    .btn-google:hover { border-color: var(--linen-dark); background: var(--parchment); }
    .btn-google:disabled { opacity: 0.5; cursor: default; }
    .modal-divider {
      display: flex; align-items: center; gap: 12px;
      color: var(--dusty-clay); font-size: 12px; margin-bottom: 14px;
    }
    .modal-divider::before, .modal-divider::after { content: ''; flex: 1; height: 0.5px; background: var(--linen-border); }
    .modal-input {
      width: 100%; padding: 10px 14px;
      border: 0.5px solid var(--linen-border); border-radius: 10px;
      font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: 300;
      color: var(--midnight); background: var(--white);
      outline: none; margin-bottom: 10px;
      transition: border-color 0.15s; -webkit-appearance: none;
    }
    .modal-input:focus { border-color: var(--magenta); }
    .modal-input::placeholder { color: var(--dusty-clay); }
    .btn-auth-submit {
      width: 100%; padding: 11px 16px; border: none; border-radius: 10px;
      background: var(--magenta); color: white;
      font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 400;
      cursor: pointer; margin-top: 2px; transition: background 0.15s;
    }
    .btn-auth-submit:hover { background: var(--hot-pink); }
    .btn-auth-submit:disabled { opacity: 0.45; cursor: default; }
    .modal-error { font-size: 12px; color: var(--dark-rose); text-align: center; margin-top: 10px; min-height: 16px; }
    .modal-toggle { text-align: center; font-size: 13px; font-weight: 300; color: var(--wine-rose); margin-top: 14px; }
    .modal-toggle a { color: var(--magenta); cursor: pointer; font-weight: 400; text-decoration: none; }

    /* ── Delete-account success overlay ──────────────── */
    .delete-success-card {
      background: var(--white); border-radius: 16px;
      padding: 28px 24px; width: 100%; max-width: 340px;
      text-align: center; position: relative;
      transform: translateY(10px); transition: transform 0.2s ease;
    }
    .modal-backdrop.open .delete-success-card { transform: translateY(0); }
    .delete-success-icon {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--petal-pink);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
    }
    .delete-success-icon svg { width: 20px; height: 20px; stroke: var(--magenta); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .delete-success-title { font-size: 15px; font-weight: 500; color: var(--midnight); margin-bottom: 6px; }
    .delete-success-body { font-size: 13px; font-weight: 300; color: var(--wine-rose); line-height: 1.6; margin-bottom: 22px; }
    .btn-delete-success-close {
      position: absolute; top: 12px; right: 12px;
      width: 28px; height: 28px; border: none; background: transparent;
      color: var(--dusty-clay); font-size: 18px; line-height: 1; cursor: pointer;
      display: flex; align-items: center; justify-content: center; border-radius: 6px;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-delete-success-close:hover { color: var(--wine-rose); }

    /* ── Nudge strip ──────────────────────────────────── */
    .nudge-strip { display: flex; align-items: center; gap: 8px; padding: 6px 0 2px 36px; }
    .nudge-btn {
      height: 28px; padding: 0 12px; border-radius: 14px;
      font-family: 'DM Sans', sans-serif; font-size: 12px;
      cursor: pointer; -webkit-tap-highlight-color: transparent; transition: opacity 0.15s;
    }
    .nudge-btn:hover { opacity: 0.8; }
    .nudge-btn.primary { background: var(--magenta); color: white; border: none; }
    .nudge-btn.secondary { background: transparent; color: var(--wine-rose); border: 0.5px solid var(--linen-border); }

    /* ── Profile overlay ──────────────────────────────── */
    .profile-backdrop {
      position: fixed; inset: 0;
      background: rgba(42,10,30,0.5);
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      z-index: 200; display: flex; align-items: center; justify-content: center;
      padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
    }
    .profile-backdrop.open { opacity: 1; pointer-events: all; }
    .profile-panel {
      background: var(--parchment); border-radius: 16px;
      box-shadow: 0 8px 48px rgba(42,10,30,0.3);
      width: 100%; max-width: 680px; max-height: 90vh;
      display: flex; flex-direction: column; overflow: hidden;
      transform: translateY(12px); transition: transform 0.2s ease;
    }
    .profile-backdrop.open .profile-panel { transform: translateY(0); }
    .profile-panel-header {
      display: flex; align-items: center; justify-content: center;
      position: relative; padding: 18px 20px;
      background: var(--midnight); flex-shrink: 0;
    }
    .profile-panel-title {
      font-family: Georgia, serif; font-style: italic; font-weight: 700;
      font-size: 16px; color: var(--soft-pink);
    }
    .profile-panel-close {
      position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
      width: 32px; height: 32px; border: none; background: transparent;
      color: var(--dark-rose); font-size: 22px; line-height: 1;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      border-radius: 6px; -webkit-tap-highlight-color: transparent;
    }
    .profile-panel-close:hover { color: var(--soft-pink); }
    .profile-panel-body { display: flex; flex: 1; min-height: 0; overflow: hidden; }

    /* Profile: sidebar nav */
    .profile-sidenav { width: 200px; flex-shrink: 0; border-right: 0.5px solid var(--linen-border); padding: 16px 0; background: var(--parchment); }
    .profile-sidenav-item {
      padding: 12px 20px; font-size: 13px; font-weight: 400;
      color: var(--wine-rose); cursor: pointer;
      border-left: 3px solid transparent;
      transition: color 0.1s, background 0.1s; user-select: none;
    }
    .profile-sidenav-item:hover { background: var(--warm-linen); color: var(--midnight); }
    .profile-sidenav-item.active { color: var(--magenta); border-left-color: var(--magenta); font-weight: 500; }

    /* Profile: content pane */
    .profile-content { flex: 1; overflow-y: auto; padding: 28px 28px 36px; background: var(--parchment); }
    .profile-content::-webkit-scrollbar { width: 4px; }
    .profile-content::-webkit-scrollbar-track { background: var(--parchment); }
    .profile-content::-webkit-scrollbar-thumb { background: var(--linen-border); border-radius: 2px; }
    .profile-content::-webkit-scrollbar-thumb:hover { background: var(--linen-dark); }
    .profile-section { display: none; }
    .profile-section.active { display: block; }

    /* Profile: mobile tabs */
    @media (max-width: 768px) {
      .profile-backdrop { padding: 0; align-items: stretch; }
      .profile-panel { border-radius: 0; max-width: 100%; max-height: 100%; height: 100%; }
      .profile-panel-body { flex-direction: column; }
      .profile-sidenav { width: 100%; border-right: none; border-bottom: 0.5px solid var(--linen-border); display: flex; flex-direction: row; overflow-x: auto; padding: 0; flex-shrink: 0; }
      .profile-sidenav::-webkit-scrollbar { height: 0; }
      .profile-sidenav-item { white-space: nowrap; border-left: none; border-bottom: 2px solid transparent; flex-shrink: 0; }
      .profile-sidenav-item.active { border-left-color: transparent; border-bottom-color: var(--magenta); }
      .profile-content { padding: 20px 16px 32px; }
    }

    /* Profile: detail fields */
    .profile-avatar-row { display: flex; justify-content: center; margin-bottom: 28px; }
    .profile-avatar-lg {
      width: 56px; height: 56px; border-radius: 50%;
      background: rgba(199,21,133,0.15); border: 1.5px solid var(--magenta);
      color: var(--magenta);
      font-family: Georgia, serif; font-style: italic; font-weight: 700; font-size: 24px;
      display: flex; align-items: center; justify-content: center; user-select: none;
    }
    .profile-field { margin-bottom: 18px; }
    .profile-field-label {
      display: block; font-size: 10px; font-weight: 500;
      color: var(--magenta); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 6px;
    }
    .profile-field-input {
      width: 100%; padding: 10px 14px;
      border: 0.5px solid var(--linen-border); border-radius: 8px;
      font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 400;
      color: var(--midnight); background: var(--white); outline: none;
      transition: border-color 0.15s; -webkit-appearance: none;
    }
    .profile-field-input:focus { border-color: var(--magenta); }
    .profile-field-input[readonly] { background: var(--parchment); color: var(--wine-rose); cursor: default; }
    .profile-member-since { font-size: 12px; font-weight: 300; color: var(--dusty-clay); margin-top: 4px; }
    .btn-save-profile {
      padding: 10px 24px; background: var(--magenta); color: white;
      border: none; border-radius: 20px;
      font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 400;
      cursor: pointer; transition: background 0.15s; margin-top: 8px;
    }
    .btn-save-profile:hover { background: var(--hot-pink); }
    .btn-save-profile:disabled { opacity: 0.5; cursor: default; }
    @media (max-width: 768px) { .btn-save-profile { width: 100%; } }
    .profile-save-msg { font-size: 12px; color: var(--magenta); margin-top: 10px; height: 18px; transition: opacity 0.4s; }
    .profile-save-msg.hidden { opacity: 0; }

    /* Profile: danger zone */
    .profile-danger-zone { margin-top: 40px; padding-top: 20px; border-top: 0.5px solid var(--linen-border); }
    .btn-delete-account { font-size: 12px; font-weight: 300; color: var(--dark-rose); background: none; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; padding: 0; opacity: 0.8; }
    .btn-delete-account:hover { opacity: 1; color: var(--wine-rose); }
    .profile-delete-confirm { margin-top: 14px; font-size: 12px; font-weight: 300; color: var(--wine-rose); line-height: 1.6; }
    .profile-delete-confirm p { margin-bottom: 14px; }
    .profile-delete-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-confirm-delete { padding: 8px 18px; background: var(--dark-rose); color: var(--soft-pink); border: none; border-radius: 20px; font-family: 'DM Sans', sans-serif; font-size: 12px; cursor: pointer; }
    .btn-cancel-delete { padding: 8px 18px; background: transparent; color: var(--wine-rose); border: 0.5px solid var(--linen-border); border-radius: 20px; font-family: 'DM Sans', sans-serif; font-size: 12px; cursor: pointer; }

    /* ── Palate section ───────────────────────────────── */
    .palate-empty-state { text-align: center; padding: 48px 24px; font-size: 13px; font-weight: 300; color: var(--wine-rose); line-height: 1.8; }
    .palate-card { margin-bottom: 28px; }
    .palate-card-label { font-size: 10px; font-weight: 500; color: var(--magenta); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 12px; }
    .palate-pills { display: flex; flex-wrap: wrap; gap: 8px; }
    .palate-pill-wrap { display: flex; flex-direction: column; gap: 3px; }
    .palate-pill {
      display: flex; align-items: center; gap: 6px;
      background: var(--petal-pink); color: var(--wine-rose);
      border: 0.5px solid var(--soft-pink);
      padding: 3px 10px 3px 12px; border-radius: 20px;
      font-size: 11px; font-weight: 500;
    }
    .palate-pill-x { background: none; border: none; color: var(--dusty-clay); cursor: pointer; font-size: 14px; line-height: 1; padding: 0; display: flex; align-items: center; -webkit-tap-highlight-color: transparent; }
    .palate-pill-x:hover { color: var(--dark-rose); }
    .palate-pill-context { font-size: 11px; color: var(--dusty-clay); padding-left: 4px; font-weight: 300; }
    .palate-card-empty { font-size: 12px; font-weight: 300; color: var(--dusty-clay); font-style: italic; }
    .palate-footer { margin-top: 32px; padding-top: 20px; border-top: 0.5px solid var(--linen-border); }
    .palate-footer-note { font-size: 12px; font-weight: 300; color: var(--wine-rose); font-style: italic; line-height: 1.6; margin-bottom: 16px; }
    .btn-clear-palate { font-size: 12px; font-weight: 300; color: var(--dark-rose); background: none; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; padding: 0; opacity: 0.8; }
    .btn-clear-palate:hover { opacity: 1; }
    .palate-clear-confirm { margin-top: 12px; font-size: 12px; font-weight: 300; color: var(--wine-rose); line-height: 1.6; }
    .palate-clear-confirm p { margin-bottom: 12px; }
    .palate-clear-btns { display: flex; gap: 8px; }
  </style>
</head>
<body>

  <!-- Drawer overlay -->
  <div class="drawer-overlay" id="drawerOverlay"></div>

  <!-- Left drawer -->
  <nav class="drawer" id="drawer" aria-label="Main menu">
    <div class="drawer-header">
      <button class="btn-drawer-close" id="drawerClose" aria-label="Close menu">×</button>
    </div>
    <div class="drawer-new-chat-wrap">
      <button class="btn-new-chat" id="newChatBtn">+ New Chat</button>
    </div>
    <div class="drawer-divider"></div>
    <div class="drawer-section-label">Conversations</div>
    <div class="drawer-conv-list" id="drawerConvList"></div>
    <div class="drawer-divider"></div>
    <div class="drawer-profile" id="drawerProfile"></div>
  </nav>

  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <button class="btn-hamburger" id="menuBtn" aria-label="Open menu">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#F4B8D4" stroke-width="1.5" stroke-linecap="round">
          <line x1="2" y1="4.5" x2="16" y2="4.5"/>
          <line x1="2" y1="9"   x2="16" y2="9"/>
          <line x1="2" y1="13.5" x2="16" y2="13.5"/>
        </svg>
      </button>
      <a href="/" class="header-logo">
        <img src="/images/wini-icon-transparent.png" alt="Wini W" class="header-logo-icon" />
        <div class="header-logo-text">
          <span class="header-logo-name">Wini</span>
          <span class="header-logo-sub">Winederella wine concierge</span>
        </div>
      </a>
    </div>
  </header>

  <!-- Auth modal -->
  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-label="Sign in">
    <div class="modal">
      <div class="modal-logo">Wini</div>
      <div class="modal-subtitle">Winederella wine concierge</div>

      <button class="btn-google" id="googleSignInBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>

      <div class="modal-divider">or</div>

      <input class="modal-input" type="email"    id="authEmail"    placeholder="Email address" autocomplete="email">
      <input class="modal-input" type="password" id="authPassword" placeholder="Password"      autocomplete="current-password">
      <button class="btn-auth-submit" id="authSubmitBtn">Sign in</button>
      <div class="modal-error" id="authError"></div>

      <div class="modal-toggle">
        <span id="authToggleText">Don't have an account?</span>&nbsp;<a id="authToggleLink">Sign up</a>
      </div>
    </div>
  </div>

  <!-- Account deleted overlay -->
  <div class="modal-backdrop" id="deleteSuccessBackdrop" role="dialog" aria-modal="true" aria-label="Account deleted">
    <div class="delete-success-card">
      <button class="btn-delete-success-close" id="deleteSuccessClose" aria-label="Close">×</button>
      <div class="delete-success-icon">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </div>
      <div class="delete-success-title">Your account has been deleted</div>
      <div class="delete-success-body">All your saved conversations and preferences are gone too.</div>
      <button class="btn-auth-submit" id="deleteSuccessStartChat">Start a new chat</button>
    </div>
  </div>

  <!-- Profile overlay -->
  <div class="profile-backdrop" id="profileBackdrop">
    <div class="profile-panel">
      <div class="profile-panel-header">
        <span class="profile-panel-title">My profile</span>
        <button class="profile-panel-close" id="profileClose" aria-label="Close">×</button>
      </div>
      <div class="profile-panel-body">
        <nav class="profile-sidenav" id="profileSidenav">
          <div class="profile-sidenav-item active" data-section="details">Profile details</div>
          <div class="profile-sidenav-item"         data-section="palate">Your palate</div>
        </nav>
        <div class="profile-content" id="profileContent">
          <div class="profile-section active" id="section-details"></div>
          <div class="profile-section"        id="section-palate"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Chat -->
  <main class="chat" id="chat"></main>

  <!-- Input -->
  <div class="input-area">
    <div class="attach-warning" id="attachWarning"></div>
    <div class="img-preview" id="imgPreview"></div>
    <div class="input-row">
      <button class="btn-attach" id="attachBtn" aria-label="Attach photo">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#C4A898" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
      </button>
      <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
      <div class="input-pill">
        <textarea id="msgInput" placeholder="Ask Wini anything…" rows="1" aria-label="Message"></textarea>
      </div>
      <button class="btn-send" id="sendBtn" disabled aria-label="Send">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="white" stroke="none">
          <path d="M2 21L23 12 2 3v7l15 2-15 2v7z"/>
        </svg>
      </button>
    </div>
  </div>


  <script>
    // ── Session state ──────────────────────────────────────────────────────────
    // V2: persist session to database for cross-session memory and user profiles
    const session = {
      messages: [],      // [{role, content}] — full history sent to API
      preferences: {}    // V2: populated from onboarding + profile
    };

    // ── DOM refs ───────────────────────────────────────────────────────────────
    const chat      = document.getElementById('chat');
    const msgInput  = document.getElementById('msgInput');
    const sendBtn   = document.getElementById('sendBtn');
    const attachBtn = document.getElementById('attachBtn');
    const fileInput = document.getElementById('fileInput');
    const imgPreview   = document.getElementById('imgPreview');
    const attachWarningEl = document.getElementById('attachWarning');
    const menuBtn      = document.getElementById('menuBtn');
    const drawer       = document.getElementById('drawer');
    const drawerOverlay = document.getElementById('drawerOverlay');
    const drawerClose  = document.getElementById('drawerClose');

    let pendingImages = []; // [{ base64, mediaType, dataUrl }]
    let isLoading    = false;
    const MAX_PAYLOAD_BYTES = 4 * 1024 * 1024; // safety margin under Vercel's 4.5MB body limit

    // ── Auth state ─────────────────────────────────────────────────────────────
    let supabaseClient          = null;
    let currentUser             = null;
    let currentConvId           = null;  // active conversation ID in Supabase
    let winiResponseCount       = 0;     // counts real responses (not the greeting)
    let nudgeShown              = false;
    let authMode                = 'signin'; // 'signin' | 'signup'
    let recentRecommendations   = [];    // wine names mentioned this session (max 10)
    const todayDate             = new Date().toISOString().split('T')[0];

    // ── Auth: Supabase init ────────────────────────────────────────────────────

    async function initSupabase() {
      try {
        const cfg = await fetch('/api/config').then(r => r.json());
        if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) return;
        supabaseClient = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

        // onAuthStateChange fires immediately with the current state
        // (INITIAL_SESSION) covering page reloads, OAuth redirects and
        // existing localStorage sessions — no separate getSession() needed.
        supabaseClient.auth.onAuthStateChange(async (event, authSession) => {
          if (authSession?.user) {
            const isNewSignIn = !currentUser;
            currentUser = authSession.user;
            updateHeaderForUser(currentUser);
            hideModal();
            // Only save conversation on an explicit new sign-in, not every reload
            if (isNewSignIn && event === 'SIGNED_IN' && !currentConvId) {
              await saveCurrentConversation();
            }
          } else if (event === 'SIGNED_OUT' || (event === 'INITIAL_SESSION' && !authSession)) {
            currentUser   = null;
            currentConvId = null;
            updateHeaderForUser(null);
          }
        });

      } catch (err) {
        console.warn('Supabase init failed — auth unavailable:', err.message);
        // App continues to work fully without auth
      }
    }

    // ── Auth: header UI (no-op — auth UI lives in the drawer now) ──────────────

    function updateHeaderForUser(_user) {
      // drawer handles all auth state display via renderDrawerProfile()
    }

    // ── Auth: modal ────────────────────────────────────────────────────────────

    function showModal() {
      document.getElementById('modalBackdrop').classList.add('open');
      document.getElementById('authEmail').focus();
      setAuthMode('signin');
    }

    function hideModal() {
      document.getElementById('modalBackdrop').classList.remove('open');
      document.getElementById('authError').textContent = '';
      document.getElementById('authEmail').value    = '';
      document.getElementById('authPassword').value = '';
    }

    function setAuthMode(mode) {
      authMode = mode;
      const submitBtn  = document.getElementById('authSubmitBtn');
      const toggleText = document.getElementById('authToggleText');
      const toggleLink = document.getElementById('authToggleLink');
      const pwdInput   = document.getElementById('authPassword');

      if (mode === 'signin') {
        submitBtn.textContent  = 'Sign in';
        toggleText.textContent = "Don't have an account?";
        toggleLink.textContent = 'Sign up';
        pwdInput.autocomplete  = 'current-password';
      } else {
        submitBtn.textContent  = 'Create account';
        toggleText.textContent = 'Already have an account?';
        toggleLink.textContent = 'Sign in';
        pwdInput.autocomplete  = 'new-password';
      }
      document.getElementById('authError').textContent = '';
    }


    // Close on backdrop click
    document.getElementById('modalBackdrop').addEventListener('click', (e) => {
      if (e.target === document.getElementById('modalBackdrop')) hideModal();
    });

    // ── Delete-account success overlay ─────────────────────────────────────────

    function showDeleteSuccessOverlay() {
      document.getElementById('deleteSuccessBackdrop').classList.add('open');
    }

    function dismissDeleteSuccessOverlay() {
      document.getElementById('deleteSuccessBackdrop').classList.remove('open');
      init(); // re-seed Wini's greeting now that the account is gone
    }

    document.getElementById('deleteSuccessBackdrop').addEventListener('click', (e) => {
      if (e.target === document.getElementById('deleteSuccessBackdrop')) dismissDeleteSuccessOverlay();
    });
    document.getElementById('deleteSuccessClose').addEventListener('click', dismissDeleteSuccessOverlay);
    document.getElementById('deleteSuccessStartChat').addEventListener('click', dismissDeleteSuccessOverlay);

    document.getElementById('authToggleLink').addEventListener('click', () => {
      setAuthMode(authMode === 'signin' ? 'signup' : 'signin');
    });

    // ── Auth: Google OAuth ─────────────────────────────────────────────────────

    document.getElementById('googleSignInBtn').addEventListener('click', async () => {
      if (!supabaseClient) return;
      const btn = document.getElementById('googleSignInBtn');
      btn.disabled = true;
      btn.textContent = 'Redirecting…';
      await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin },
      });
      // Page will redirect — no need to re-enable button
    });

    // ── Auth: email + password ─────────────────────────────────────────────────

    document.getElementById('authSubmitBtn').addEventListener('click', handleEmailAuth);

    document.getElementById('authPassword').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleEmailAuth();
    });

    async function handleEmailAuth() {
      if (!supabaseClient) return;
      const email    = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;
      const errEl    = document.getElementById('authError');
      const submitBtn = document.getElementById('authSubmitBtn');

      if (!email || !password) { errEl.textContent = 'Please fill in both fields.'; return; }

      submitBtn.disabled = true;
      submitBtn.textContent = authMode === 'signin' ? 'Signing in…' : 'Creating account…';
      errEl.textContent = '';

      try {
        let result;
        if (authMode === 'signin') {
          result = await supabaseClient.auth.signInWithPassword({ email, password });
        } else {
          result = await supabaseClient.auth.signUp({ email, password });
          if (!result.error && result.data.user && !result.data.session) {
            errEl.style.color = 'var(--slate)';
            errEl.textContent = 'Check your email to confirm your account.';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Create account';
            return;
          }
        }
        if (result.error) throw result.error;
        // onAuthStateChange handles the rest
      } catch (err) {
        errEl.style.color = '';
        errEl.textContent = err.message || 'Something went wrong. Try again.';
        submitBtn.disabled = false;
        submitBtn.textContent = authMode === 'signin' ? 'Sign in' : 'Create account';
      }
    }

    // ── Auth: save conversation to Supabase ────────────────────────────────────

    async function saveCurrentConversation() {
      if (!supabaseClient || !currentUser || currentConvId) return;

      // Filter out the synthetic seeding exchange
      const real = session.messages.filter(
        m => !(m.role === 'user' && m.content === 'Hi')
      );
      if (real.length < 2) return;

      try {
        const firstUser = real.find(m => m.role === 'user');
        const raw  = typeof firstUser?.content === 'string'
          ? firstUser.content
          : firstUser?.content?.find?.(c => c.type === 'text')?.text || 'Conversation';
        const title = raw.slice(0, 50);

        const { data: conv, error } = await supabaseClient
          .from('conversations')
          .insert({ user_id: currentUser.id, title })
          .select()
          .single();

        if (error) throw error;
        currentConvId = conv.id;

        const rows = real.map(m => ({
          conversation_id: currentConvId,
          role:    m.role,
          content: typeof m.content === 'string' ? m.content : JSON.stringify(m.content),
        }));
        await supabaseClient.from('messages').insert(rows);

      } catch (err) {
        console.error('Failed to save conversation:', err.message);
      }
    }

    async function saveUserMessage(userContent) {
      if (!supabaseClient || !currentUser) return;
      try {
        if (!currentConvId) {
          const raw = typeof userContent === 'string'
            ? userContent
            : userContent?.find?.(c => c.type === 'text')?.text || 'Conversation';
          const { data: conv, error } = await supabaseClient
            .from('conversations')
            .insert({ user_id: currentUser.id, title: raw.slice(0, 50) })
            .select()
            .single();
          if (error) throw error;
          currentConvId = conv.id;
        }
        await supabaseClient.from('messages').insert({
          conversation_id: currentConvId,
          role: 'user',
          content: typeof userContent === 'string' ? userContent : JSON.stringify(userContent),
        });
      } catch (err) {
        console.error('Failed to save user message:', err.message);
      }
    }

    async function saveAssistantMessage(assistantText) {
      if (!supabaseClient || !currentUser || !currentConvId) return;
      try {
        await supabaseClient.from('messages').insert({
          conversation_id: currentConvId,
          role: 'assistant',
          content: assistantText,
        });
      } catch (err) {
        console.error('Failed to save assistant message:', err.message);
      }
    }

          .from('messages')
          .select('role, content')

    // ── Drawer: new chat ───────────────────────────────────────────────────────

    async function startNewChat() {

    // ── Helpers ────────────────────────────────────────────────────────────────

    function relativeDate(iso) {
      const d = new Date(iso);
      const now = new Date();
      const diffDays = Math.floor((now - d) / 86400000);
      if (diffDays === 0) return 'Today';
      if (diffDays === 1) return 'Yesterday';
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Extract wine names from Wini's response text (capitalised phrases after trigger words)
    function extractWineNames(text) {
      const wines = new Set();
      const re = /(?:suggest|recommend|try)\s+(?:the\s+)?([A-Z][A-Za-z']+(?:\s+[A-Z][A-Za-z']+){0,4})/gi;
      let m;
      while ((m = re.exec(text)) !== null) {
        const name = m[1].trim();
        if (name.length > 3) wines.add(name);
      }
      return [...wines];
    }

    // Close drawer or modal on Escape
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { closeDrawer(); hideModal(); }
    });

    // ── Helpers ────────────────────────────────────────────────────────────────

    function scrollBottom() {
      chat.scrollTop = chat.scrollHeight;
    }

    // Minimal markdown → HTML (no external deps)
    function renderMarkdown(text) {
      const escaped = text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      const lines = escaped.split('\n');
      let html = '';
      let inList = false;
      let listTag = '';

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i];

        // Horizontal rule
        if (line.trim() === '---') {
          if (inList) { html += `</${listTag}>`; inList = false; }
          html += '<hr>';
          continue;
        }

        // Bold & italic
        line = line
          .replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>')
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/\*(.+?)\*/g, '<em>$1</em>');

        // Links [text](url)
        line = line.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,
          '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

        // Unordered list item
        const ulMatch = line.match(/^[-•]\s+(.*)/);
        // Ordered list item
        const olMatch = line.match(/^\d+\.\s+(.*)/);

        if (ulMatch) {
          if (!inList || listTag !== 'ul') {
            if (inList) html += `</${listTag}>`;
            html += '<ul>';
            inList = true; listTag = 'ul';
          }
          html += `<li>${ulMatch[1]}</li>`;
        } else if (olMatch) {
          if (!inList || listTag !== 'ol') {
            if (inList) html += `</${listTag}>`;
            html += '<ol>';
            inList = true; listTag = 'ol';
          }
          html += `<li>${olMatch[1]}</li>`;
        } else {
          if (inList) { html += `</${listTag}>`; inList = false; }
          if (line.trim() === '') {
            // blank line = paragraph break (swallow multiple blanks)
          } else {
            html += `<p>${line}</p>`;
          }
        }
      }

      if (inList) html += `</${listTag}>`;
      return html;
    }

    function setDisabled(disabled) {
      msgInput.disabled   = disabled;
      attachBtn.disabled  = disabled;
      sendBtn.disabled    = disabled || (!msgInput.value.trim() && !pendingImages.length);
    }

    function updateSendBtn() {
      sendBtn.disabled = isLoading || (!msgInput.value.trim() && !pendingImages.length);
    }

    // ── Render messages ────────────────────────────────────────────────────────

    function appendMessage(role, text, imageDataUrls) {
      const row = document.createElement('div');
      row.className = `row ${role}`;

      if (role === 'wini') {
        const av = document.createElement('div');
        av.className = 'avatar';
        av.textContent = 'W';
        av.setAttribute('aria-hidden', 'true');
        row.appendChild(av);
      }

      const bubble = document.createElement('div');
      bubble.className = `bubble ${role}`;

      const urls = Array.isArray(imageDataUrls) ? imageDataUrls : (imageDataUrls ? [imageDataUrls] : []);
      if (urls.length) {
        const imgWrap = document.createElement('div');
        imgWrap.className = `bubble-img-wrap ${urls.length === 1 ? 'single' : 'multi'}`;
        urls.forEach((url, i) => {
          const img = document.createElement('img');
          img.src = url;
          img.alt = urls.length > 1 ? `Attached photo ${i + 1}` : 'Attached photo';
          imgWrap.appendChild(img);
        });
        bubble.appendChild(imgWrap);
      }

      if (text) {
        const inner = document.createElement('div');
        inner.innerHTML = renderMarkdown(text);
        bubble.appendChild(inner);
      }

      row.appendChild(bubble);
      chat.appendChild(row);
      scrollBottom();
      return { row, bubble };
    }

    function addTyping() {
      const row = document.createElement('div');
      row.className = 'row wini';
      row.id = 'typing-row';

      const av = document.createElement('div');
      av.className = 'avatar';
      av.textContent = 'W';
      av.setAttribute('aria-hidden', 'true');
      row.appendChild(av);

      const bubble = document.createElement('div');
      bubble.className = 'bubble wini';
      bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
      row.appendChild(bubble);

      chat.appendChild(row);
      scrollBottom();
    }

    function removeTyping() {
      const el = document.getElementById('typing-row');
      if (el) el.remove();
    }

    // ── Image attach ───────────────────────────────────────────────────────────

    attachBtn.addEventListener('click', () => fileInput.click());

    // Resize a single file to max 1024px on longest side before encoding —
    // prevents hitting Vercel's 4.5 MB body limit on real phone photos
    function resizeImageFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const MAX = 1024;
            let { width, height } = img;
            if (width > MAX || height > MAX) {
              if (width > height) { height = Math.round(height * MAX / width); width = MAX; }
              else                { width  = Math.round(width  * MAX / height); height = MAX; }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width; canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            const mediaType = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
            const dataUrl   = canvas.toDataURL(mediaType, 0.85);
            const base64    = dataUrl.split(',')[1];
            resolve({ base64, mediaType, dataUrl });
          };
          img.onerror = () => reject(new Error('Could not read image'));
          img.src = ev.target.result;
        };
        reader.onerror = () => reject(new Error('Could not read file'));
        reader.readAsDataURL(file);
      });
    }

    fileInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files || []);
      fileInput.value = '';
      if (!files.length) return;

      for (const file of files) {
        try {
          pendingImages.push(await resizeImageFile(file));
        } catch (err) {
          console.warn('Failed to process image:', err.message);
        }
      }
      renderImagePreviews();
      updateSendBtn();
    });

    function renderImagePreviews() {
      imgPreview.innerHTML = '';
      if (!pendingImages.length) {
        imgPreview.classList.remove('show');
        checkAttachSize();
        return;
      }
      imgPreview.classList.add('show');
      pendingImages.forEach((imgData, idx) => {
        const thumb = document.createElement('div');
        thumb.className = 'img-thumb';

        const img = document.createElement('img');
        img.src = imgData.dataUrl;
        img.alt = `Attached photo ${idx + 1}`;

        const removeBtn = document.createElement('button');
        removeBtn.className = 'img-thumb-remove';
        removeBtn.setAttribute('aria-label', `Remove photo ${idx + 1}`);
        removeBtn.textContent = '×';
        removeBtn.addEventListener('click', () => {
          pendingImages.splice(idx, 1);
          renderImagePreviews();
          updateSendBtn();
        });

        thumb.appendChild(img);
        thumb.appendChild(removeBtn);
        imgPreview.appendChild(thumb);
      });
      checkAttachSize();
    }

    // Estimates the full request body size (whole session history + this message) —
    // Vercel's 4.5MB limit applies to the entire POST body, not just new attachments.
    function estimatePayloadSize(newContentBlocks) {
      const prospectiveMessages = session.messages.concat([{
        role: 'user',
        content: newContentBlocks.length === 1 && newContentBlocks[0].type === 'text'
          ? newContentBlocks[0].text
          : newContentBlocks,
      }]);
      const body = JSON.stringify({
        messages: prospectiveMessages,
        userId: currentUser?.id || null,
        recentRecommendations,
      });
      return body.length; // base64/ASCII JSON — length is a close proxy for byte size
    }

    function checkAttachSize() {
      if (!pendingImages.length) {
        attachWarningEl.classList.remove('show');
        attachWarningEl.textContent = '';
        return;
      }
      const blocks = pendingImages.map(p => ({
        type: 'image',
        source: { type: 'base64', media_type: p.mediaType, data: p.base64 },
      }));
      const text = msgInput.value.trim();
      if (text) blocks.push({ type: 'text', text });

      const size = estimatePayloadSize(blocks);
      const mb = (size / (1024 * 1024)).toFixed(1);
      if (size > MAX_PAYLOAD_BYTES) {
        attachWarningEl.textContent = `That's ${mb}MB — over the limit. Remove a photo before sending.`;
        attachWarningEl.classList.add('show');
      } else if (size > MAX_PAYLOAD_BYTES * 0.8) {
        attachWarningEl.textContent = `Getting close to the size limit (${mb}MB).`;
        attachWarningEl.classList.add('show');
      } else {
        attachWarningEl.classList.remove('show');
        attachWarningEl.textContent = '';
      }
    }

    // ── Textarea auto-resize ───────────────────────────────────────────────────

    msgInput.addEventListener('input', () => {
      msgInput.style.height = 'auto';
      msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
      updateSendBtn();
    });

    msgInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!sendBtn.disabled) sendMessage();
      }
    });

    sendBtn.addEventListener('click', sendMessage);

    // ── Send ───────────────────────────────────────────────────────────────────

    async function sendMessage() {
      if (isLoading) return;
      const text = msgInput.value.trim();
      if (!text && !pendingImages.length) return;

      // Build API content block
      const contentBlocks = [];
      const displayImageUrls = [];

      for (const imgData of pendingImages) {
        contentBlocks.push({
          type: 'image',
          source: {
            type: 'base64',
            media_type: imgData.mediaType,
            data: imgData.base64,
          },
        });
        displayImageUrls.push(imgData.dataUrl);
      }

      if (text) {
        contentBlocks.push({ type: 'text', text });
      }

      // Hard stop before sending — Vercel's body limit applies to the whole
      // request, including prior session history, not just these attachments
      const estimatedSize = estimatePayloadSize(contentBlocks);
      if (estimatedSize > MAX_PAYLOAD_BYTES) {
        const mb = (estimatedSize / (1024 * 1024)).toFixed(1);
        attachWarningEl.textContent = `That's ${mb}MB — too large to send. Remove a photo or two and try again.`;
        attachWarningEl.classList.add('show');
        return;
      }

      // Render user message
      appendMessage('user', text, displayImageUrls);

      // Add to session history
      session.messages.push({
        role: 'user',
        content: contentBlocks.length === 1 && contentBlocks[0].type === 'text'
          ? text          // shorthand for text-only
          : contentBlocks,
      });

      // Reset input
      msgInput.value = '';
      msgInput.style.height = 'auto';
      pendingImages = [];
      renderImagePreviews();

      // Save user message immediately (fire-and-forget, never blocks chat)
      saveUserMessage(
        contentBlocks.length === 1 && contentBlocks[0].type === 'text'
          ? text : contentBlocks
      );

      isLoading = true;
      setDisabled(true);
      addTyping();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: session.messages,
            userId:   currentUser?.id || null,
            recentRecommendations,
          }),
        });

        removeTyping();

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error || `Server error ${res.status}`);
        }

        const data = await res.json();
        const replyText = data?.content?.[0]?.text ?? '';

        appendMessage('wini', replyText);
        session.messages.push({ role: 'assistant', content: replyText });

        // Save assistant message once fully received
        saveAssistantMessage(replyText);

        // Track wine names mentioned this session
        const newWines = extractWineNames(replyText);
        recentRecommendations = [...recentRecommendations, ...newWines].slice(-10);

        // Background palate extraction — fire and forget, never blocks chat
        if (currentUser) {
          const userTextForExtraction = typeof text === 'string' && text
            ? text
            : (Array.isArray(contentBlocks)
                ? (contentBlocks.find(c => c.type === 'text')?.text || '')
                : '');
          if (userTextForExtraction) {
            fetch('/api/extract-palate', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                userId:           currentUser.id,
                userMessage:      userTextForExtraction,
                assistantMessage: replyText,
                todayDate,
              }),
            }).catch(err => console.warn('extract-palate failed (non-fatal):', err.message));
          }
        }

        // Save nudge — show after 3rd real response if not logged in
        winiResponseCount++;
        if (winiResponseCount === 3 && !currentUser && !nudgeShown) {
          nudgeShown = true;
          appendNudgeStrip();
        }

      } catch (err) {
        removeTyping();
        appendMessage('wini', `Something went wrong — ${err.message}. Try again?`);
      } finally {
        isLoading = false;
        setDisabled(false);
        updateSendBtn();
        msgInput.focus();
      }
    }

    // ── Boot: let the model generate its own opening greeting ─────────────────
    // V2: onboarding flow here on first launch — collect preferences, budget, preferred shop
    //
    // We call the API with [user:'Hi'] so the model generates the greeting itself
    // and is already in Wini's voice before the user types anything — same as
    // how Claude.ai works. A hardcoded greeting fed back as history doesn't warm
    // the model into character; generating it does.

    async function init() {
      setDisabled(true);
      addTyping();

      session.messages.push({ role: 'user', content: 'Hi' });

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: session.messages,
            userId:   currentUser?.id || null,
            recentRecommendations: [],
          }),
        });

        removeTyping();

        if (!res.ok) throw new Error('Failed to connect');

        const data = await res.json();
        const greeting = data?.content?.[0]?.text ?? "Hi, I'm Winederella — Wini for short — your wine guide. Tell me what's going on right now and I'll help.";

        appendMessage('wini', greeting);
        session.messages.push({ role: 'assistant', content: greeting });

      } catch {
        removeTyping();
        const fallback = "Hi, I'm Winederella — Wini for short — your wine guide. Tell me what's going on right now and I'll help. Are you shopping, cooking, at a restaurant, or planning something?";
        appendMessage('wini', fallback);
        session.messages.push({ role: 'assistant', content: fallback });
      } finally {
        setDisabled(false);
        updateSendBtn();
        msgInput.focus();
      }
    }

    // ── Profile overlay ────────────────────────────────────────────────────────

    function openProfileOverlay() {
      if (!currentUser) { showModal(); return; }
      document.getElementById('profileBackdrop').classList.add('open');
      switchProfileSection('details');
      renderProfileDetails();
      renderPalateSection();
    }

    function closeProfileOverlay() {
      document.getElementById('profileBackdrop').classList.remove('open');
    }

    document.getElementById('profileClose').addEventListener('click', closeProfileOverlay);

    function switchProfileSection(name) {
      document.querySelectorAll('.profile-section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.profile-sidenav-item').forEach(i => {
        i.classList.toggle('active', i.dataset.section === name);
      });
      document.getElementById('section-' + name).classList.add('active');
    }

    document.querySelectorAll('.profile-sidenav-item').forEach(item => {
      item.addEventListener('click', () => switchProfileSection(item.dataset.section));
    });

    // ── Profile details section ────────────────────────────────────────────────

    async function renderProfileDetails() {
      const el = document.getElementById('section-details');
      if (!el || !currentUser) return;

      const email      = currentUser.email || '';
      const metaName   = currentUser.user_metadata?.full_name || '';
      const firstLogin = currentUser.created_at
        ? new Date(currentUser.created_at).toLocaleDateString('en-AU', { month: 'long', year: 'numeric' })
        : '';

      // Fetch or seed profiles row
      let displayName = metaName;
      let nickname    = metaName.split(' ')[0] || '';

      try {
        const { data, error } = await supabaseClient
          .from('profiles')
          .select('display_name, nickname')
          .eq('user_id', currentUser.id)
          .single();

        if (error && error.code === 'PGRST116') {
          // Row doesn't exist yet — create it
          await supabaseClient.from('profiles').insert({
            user_id:      currentUser.id,
            display_name: displayName,
            nickname,
          });
        } else if (!error && data) {
          displayName = data.display_name ?? displayName;
          nickname    = data.nickname    ?? nickname;
        }
      } catch (err) {
        console.warn('profiles fetch failed:', err.message);
      }

      const initial = (displayName[0] || email[0] || '?').toUpperCase();

      el.innerHTML = `
        <div class="profile-avatar-row">
          <div class="profile-avatar-lg">${initial}</div>
        </div>
        <div class="profile-field">
          <label class="profile-field-label" for="pd-name">Full name</label>
          <input class="profile-field-input" id="pd-name" type="text"
                 value="${escHtml(displayName)}" autocomplete="name">
        </div>
        <div class="profile-field">
          <label class="profile-field-label" for="pd-nick">What should Wini call you?</label>
          <input class="profile-field-input" id="pd-nick" type="text"
                 value="${escHtml(nickname)}" autocomplete="nickname">
        </div>
        <div class="profile-field">
          <label class="profile-field-label">Email</label>
          <input class="profile-field-input" type="email"
                 value="${escHtml(email)}" readonly>
        </div>
        <div class="profile-field">
          <label class="profile-field-label">Member since</label>
          <div class="profile-member-since">Member since ${firstLogin}</div>
        </div>
        <button class="btn-save-profile" id="btnSaveProfile">Save changes</button>
        <div class="profile-save-msg hidden" id="profileSaveMsg">Changes saved</div>

        <div class="profile-danger-zone">
          <button class="btn-delete-account" id="btnDeleteAccount">Delete account</button>
          <div class="profile-delete-confirm" id="deleteConfirmBox" style="display:none">
            <p>This will permanently delete your account and all your data. This can't be undone.</p>
            <div class="profile-delete-btns">
              <button class="btn-confirm-delete" id="btnConfirmDelete">Yes, delete everything</button>
              <button class="btn-cancel-delete"  id="btnCancelDelete">Cancel</button>
            </div>
          </div>
        </div>`;

      document.getElementById('btnSaveProfile').addEventListener('click', saveProfileDetails);
      document.getElementById('btnDeleteAccount').addEventListener('click', () => {
        document.getElementById('deleteConfirmBox').style.display = 'block';
        document.getElementById('btnDeleteAccount').style.display = 'none';
      });
      document.getElementById('btnCancelDelete').addEventListener('click', () => {
        document.getElementById('deleteConfirmBox').style.display = 'none';
        document.getElementById('btnDeleteAccount').style.display = '';
      });
      document.getElementById('btnConfirmDelete').addEventListener('click', deleteAccount);
    }

    async function saveProfileDetails() {
      if (!supabaseClient || !currentUser) return;
      const btn         = document.getElementById('btnSaveProfile');
      const displayName = document.getElementById('pd-name').value.trim();
      const nickname    = document.getElementById('pd-nick').value.trim();
      const msgEl       = document.getElementById('profileSaveMsg');

      btn.disabled = true;
      try {
        const { error } = await supabaseClient
          .from('profiles')
          .upsert({ user_id: currentUser.id, display_name: displayName, nickname },
                  { onConflict: 'user_id' });
        if (error) throw error;

        // Update drawer avatar name
        const nameEl = document.querySelector('.drawer-profile-name');
        if (nameEl) nameEl.textContent = displayName;
        const avatarEl = document.querySelector('.drawer-avatar');
        if (avatarEl) avatarEl.textContent = (displayName[0] || '?').toUpperCase();

        msgEl.classList.remove('hidden');
        setTimeout(() => msgEl.classList.add('hidden'), 2000);
      } catch (err) {
        console.error('save profile failed:', err.message);
      } finally {
        btn.disabled = false;
      }
    }

    async function deleteAccount() {
      if (!currentUser) return;
      const btn = document.getElementById('btnConfirmDelete');
      btn.disabled = true;
      btn.textContent = 'Deleting…';
      try {
        const res = await fetch('/api/delete-account', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: currentUser.id }),
        });
        if (!res.ok) throw new Error('Delete failed');
        if (supabaseClient) await supabaseClient.auth.signOut();
        closeProfileOverlay();
        chat.innerHTML = '';
        session.messages = [];
        currentConvId = null;
        currentUser = null;
        showDeleteSuccessOverlay(); // seeding runs on dismiss, not immediately
      } catch (err) {
        console.error('delete account failed:', err.message);
        btn.disabled = false;
        btn.textContent = 'Yes, delete everything';
      }
    }

    // ── Your palate section ────────────────────────────────────────────────────

    const PALATE_CARDS = [
      { field: 'styles',           label: 'Styles',              key: 'style'   },
      { field: 'grapes_loved',     label: 'Grapes you love',     key: 'grape'   },
      { field: 'grapes_disliked',  label: 'Grapes you dislike',  key: 'grape'   },
      { field: 'regions_loved',    label: 'Regions you love',    key: 'region'  },
      { field: 'regions_disliked', label: 'Regions you dislike', key: 'region'  },
      { field: 'budget',           label: 'Budget ranges',       key: 'budget'  },
      { field: 'dislikes',         label: 'Dislikes',            key: 'dislike' },
    ];

    async function renderPalateSection() {
      const el = document.getElementById('section-palate');
      if (!el || !supabaseClient || !currentUser) return;

      try {
        const { data } = await supabaseClient
          .from('palate_profile')
          .select('profile')
          .eq('user_id', currentUser.id)
          .single();

        const profile = data?.profile || {};
        const hasAny  = PALATE_CARDS.some(c => (profile[c.field] || []).length > 0);

        if (!hasAny) {
          el.innerHTML = `
            <div class="palate-empty-state">
              Wini will build your palate profile as you chat.<br>
              The more you talk, the better she knows your taste.
            </div>`;
          return;
        }

        const cardsHtml = PALATE_CARDS.map(({ field, label, key }) => {
          const items = profile[field] || [];
          const pillsHtml = items.length === 0
            ? `<span class="palate-card-empty">Nothing here yet — just keep chatting with Wini</span>`
            : `<div class="palate-pills">${items.map((item, idx) => {
                const text = key === 'budget'
                  ? `AUD ${item.min}${item.max ? '–' + item.max : '+'}`
                  : escHtml(item[key] || '');
                const ctx = item.context ? escHtml(item.context) : '';
                return `<div class="palate-pill-wrap">
                  <div class="palate-pill">
                    ${text}
                    <button class="palate-pill-x" data-field="${field}" data-idx="${idx}"
                            aria-label="Remove">×</button>
                  </div>
                  ${ctx ? `<span class="palate-pill-context">${ctx}</span>` : ''}
                </div>`;
              }).join('')}</div>`;
          return `<div class="palate-card" data-field="${field}">
            <div class="palate-card-label">${label}</div>
            ${pillsHtml}
          </div>`;
        }).join('');

        el.innerHTML = `
          ${cardsHtml}
          <div class="palate-footer">
            <p class="palate-footer-note">
              You can also just tell Wini what to change — try "remove Grenache from my preferences"
              or "update my budget to $50".
            </p>
            <button class="btn-clear-palate" id="btnClearPalate">Clear entire palate profile</button>
            <div class="palate-clear-confirm" id="palateClearConfirm" style="display:none">
              <p>This will remove all your wine preferences. Are you sure?</p>
              <div class="palate-clear-btns">
                <button class="btn-confirm-delete" id="btnConfirmClear">Yes, clear it</button>
                <button class="btn-cancel-delete"  id="btnCancelClear">Cancel</button>
              </div>
            </div>
          </div>`;

        // Delete individual pill
        el.querySelectorAll('.palate-pill-x').forEach(btn => {
          btn.addEventListener('click', async () => {
            const { field, idx } = btn.dataset;
            await deletePalateItem(field, parseInt(idx));
          });
        });

        document.getElementById('btnClearPalate').addEventListener('click', () => {
          document.getElementById('palateClearConfirm').style.display = 'block';
          document.getElementById('btnClearPalate').style.display = 'none';
        });
        document.getElementById('btnCancelClear').addEventListener('click', () => {
          document.getElementById('palateClearConfirm').style.display = 'none';
          document.getElementById('btnClearPalate').style.display = '';
        });
        document.getElementById('btnConfirmClear').addEventListener('click', clearPalate);

      } catch (err) {
        console.error('palate render failed:', err.message);
        el.innerHTML = `<div class="palate-empty-state">Couldn't load palate data.</div>`;
      }
    }

    async function deletePalateItem(field, idx) {
      if (!supabaseClient || !currentUser) return;
      try {
        const { data } = await supabaseClient
          .from('palate_profile')
          .select('profile')
          .eq('user_id', currentUser.id)
          .single();

        const profile = data?.profile || {};
        const arr = [...(profile[field] || [])];
        arr.splice(idx, 1);
        profile[field] = arr;

        await supabaseClient
          .from('palate_profile')
          .upsert({ user_id: currentUser.id, profile, updated_at: new Date().toISOString() },
                  { onConflict: 'user_id' });

        await renderPalateSection(); // re-render
      } catch (err) {
        console.error('delete palate item failed:', err.message);
      }
    }

    async function clearPalate() {
      if (!supabaseClient || !currentUser) return;
      const btn = document.getElementById('btnConfirmClear');
      btn.disabled = true;
      try {
        await supabaseClient
          .from('palate_profile')
          .upsert({ user_id: currentUser.id, profile: {}, updated_at: new Date().toISOString() },
                  { onConflict: 'user_id' });
        await renderPalateSection();
      } catch (err) {
        console.error('clear palate failed:', err.message);
        if (btn) btn.disabled = false;
      }
    }

    // ── Boot sequence ──────────────────────────────────────────────────────────
    async function boot() {
      await initSupabase(); // sets up auth before chat loads
      await init();         // generates Wini's greeting
    }

    boot();
  </script>

</body>
</html>
